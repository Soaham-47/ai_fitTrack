services:
  # 1. Local Postgres container mimicking Neon
  db:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: local_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d local_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: local_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/local_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 8000
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy

  # 3. Vite + React Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: local_vite_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  pgdata: